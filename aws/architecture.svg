<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" font-family="system-ui, sans-serif" font-size="13">
  <rect width="760" height="560" fill="#fff8f0"/>
  <text x="20" y="30" font-size="18" font-weight="700">Library Management System — AWS Architecture (ap-south-1)</text>
  <rect x="270" y="50" width="220" height="44" rx="8" fill="#7f1d1d"/><text x="380" y="77" fill="#fff" text-anchor="middle">Student / Librarian / Admin</text>
  <rect x="230" y="120" width="300" height="56" rx="8" fill="#e8590c"/><text x="380" y="143" fill="#fff" text-anchor="middle" font-weight="700">Amazon S3 — static website</text><text x="380" y="163" fill="#fff" text-anchor="middle">React frontend + book covers</text>
  <rect x="230" y="202" width="300" height="56" rx="8" fill="#2563eb"/><text x="380" y="225" fill="#fff" text-anchor="middle" font-weight="700">Application Load Balancer</text><text x="380" y="245" fill="#fff" text-anchor="middle">Health check: GET /health</text>
  <rect x="60" y="290" width="640" height="120" rx="10" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="76" y="312" font-weight="700" fill="#2563eb">VPC library-vpc 10.0.0.0/16 — public subnets ap-south-1a (10.0.1.0/24) + ap-south-1b (10.0.2.0/24)</text>
  <rect x="90" y="326" width="280" height="64" rx="8" fill="#16a34a"/><text x="230" y="350" fill="#fff" text-anchor="middle" font-weight="700">EC2 t2.micro — Node/Express</text><text x="230" y="370" fill="#fff" text-anchor="middle">8 GB gp3 EBS · IAM Library-EC2-S3-Role</text>
  <rect x="390" y="326" width="280" height="64" rx="8" fill="#16a34a"/><text x="530" y="350" fill="#fff" text-anchor="middle" font-weight="700">EC2 t2.micro — Node/Express</text><text x="530" y="370" fill="#fff" text-anchor="middle">Auto Scaling: min 1 / des 2 / max 3</text>
  <rect x="230" y="440" width="300" height="56" rx="8" fill="#0f766e"/><text x="380" y="463" fill="#fff" text-anchor="middle" font-weight="700">MongoDB Atlas (M0, outside VPC)</text><text x="380" y="483" fill="#fff" text-anchor="middle">Users · Books · Borrows · Seats</text>
  <line x1="380" y1="94" x2="380" y2="120" stroke="#333" stroke-width="2"/><line x1="380" y1="176" x2="380" y2="202" stroke="#333" stroke-width="2"/><line x1="380" y1="258" x2="380" y2="290" stroke="#333" stroke-width="2"/><line x1="380" y1="410" x2="380" y2="440" stroke="#333" stroke-width="2"/>
  <text x="20" y="530" fill="#555">Flow: browser → S3 (frontend) → ALB → EC2 (Auto Scaling) → Atlas. IAM role lets EC2 use only covers/ in S3.</text>
</svg>
